controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz

    joint_position_example_controller:
      type: franka_example_controllers/JointPositionExampleController

    joint_velocity_example_controller:
      type: franka_example_controllers/JointVelocityExampleController

    joint_impedance_example_controller:
      type: franka_example_controllers/JointImpedanceExampleController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    franka_safe_controller:
      type: franka_avoidance/FrankaSafeController

joint_position_example_controller:
  ros__parameters:
    gazebo: true

joint_velocity_example_controller:
  ros__parameters:
    gazebo: true
  
joint_impedance_example_controller:
  ros__parameters:
    k_gains:
      - 24.0
      - 24.0
      - 24.0
      - 24.0
      - 10.0
      - 6.0
      - 2.0
    d_gains:
      - 2.0
      - 2.0
      - 2.0
      - 1.0
      - 1.0
      - 1.0
      - 0.5

franka_safe_controller:
  ros__parameters:
    gazebo: true

    # Control Barrier Function (CBF) parameters
    cbf_alpha: 1.0e+1
    cbf_lambda: 2.0e+2
    cbf_move_gain: 2.0e+1
    safe_distance: 0.02
    obs_tran: [0.35, 0.8, 0.1]
    obs_vel: [+0.0, -2.0, 3.8]
    gravity: 9.81
    stab_gains: [3.0, 3.0, 3.0, 3.0, 2.0, 2.0, 1.0]
    joint_des: [0.0, 0.0, 0.0, -1.57, 0.0, 1.57, 0.785]
